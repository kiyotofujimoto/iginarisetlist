<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- OGP設定 -->
  <meta property="og:title" content="いぎなり東北産 セットリスト検索">
  <meta property="og:description" content="ライブのセットリストや楽曲の披露回数を検索できる非公式サイトです。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kiyo-iginarisetlist.com/">
  <meta property="og:image" content="https://kiyo-iginarisetlist.com/images/ogp.jpeg">

  <!-- X（旧Twitter）用 -->
  <meta name="twitter:card" content="summary">

  <title>いぎなり東北産ライブセットリスト</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

<h1 class="site-title">🍄いぎなり東北産ライブ セットリスト検索🍄</h1>
<p class="notice">
  2024年以降のセットリストを中心にまとめています。※生誕祭は除く<br>
  （余力があれば、それ以前の公演も順次追加予定です）
</p>


  <div class="filter-box">
   <div class="filter-header">
  <div class="filter-title">検索条件</div>

  <div class="seg-tabs" role="tablist" aria-label="ページ切り替え">
    <a class="seg-tab is-active" href="./index.html" role="tab" aria-selected="true">
      🔍 セットリスト検索
    </a>
    <a class="seg-tab" href="./live-count.html" role="tab" aria-selected="false">
      📊 楽曲ランキング
    </a>
  </div>

  <button type="button" class="reset-button" id="resetButton">条件リセット</button>
</div>


    <label for="yearSelect">開催年：</label>
    <select id="yearSelect"></select>

    <label for="typeSelect">形態：</label>
    <select id="typeSelect">
      <option value="">-- 全て --</option>
    </select>

    <div class="search-box">
      <input
        type="text"
        id="songSearch"
        placeholder="曲名で検索(部分一致)">
    </div>

    <div class="search-box">
      <input
        type="text"
        id="liveSearch"
        placeholder="ライブ名で検索(部分一致)">
    </div>

    <label for="liveSelect">ライブ：</label>
    <select id="liveSelect">
      <option value="">-- 選択してください --</option>
    </select>
  </div>

  <div id="result"></div>

  <footer class="site-footer">
    <p>
 ※個人が運営する非公式のまとめサイトです。<br>
        掲載内容の正確性を保証するものではありません。営利目的はありません。<br>
        また、予告なく公開を終了する場合があります。
    </p>
  </footer>

  <script src="./js/setlist.js"></script>
</body>
</html>
